# Source of truth for prices and limits. The LLM never does this arithmetic; tools/pricing_calc.py does.
# Tiers are MARGINAL: [up_to_cumulative_units, rate_per_`per`_units]; rate 0 = free allowance.
# `beyond: contact_sales` means usage past the last bound has no published list price.
# Values were read from the fetched vendor pages (data/raw/2026-11-08). HERE is intentionally absent:
# its price page did not render, so the system must abstain ("ask HERE for a quote") instead of guessing.

fx:
  usd_inr: 94.1402
  source: FBIL via rbi.org.in
  as_of: 2026-11-06

# Official price pages the SKU tiers were read from (cited by the calculator report; fetched snapshot data/raw/2026-11-08).
sources:
  Ola Maps: [https://maps.olakrutrim.com/pricing/details, https://maps.olakrutrim.com/pricing/update-2026]
  Google Maps Platform: [https://developers.google.com/maps/billing-and-pricing/pricing-india]
  Mapbox: [https://www.mapbox.com/pricing]

ola:
  distance_matrix_free_counts: pairs   # pairs | requests - UNCONFIRMED, ask Ola (rate card says "100K free calls per API")

skus:
