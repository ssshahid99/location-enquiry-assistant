# Request limits, from the fetched docs. Coordinate order is how each provider expects "a,b" pairs.
coord_order:
  Google Maps Platform: lat,lng
  Ola Maps: lat,lng
  HERE: lat,lng
  Mapbox: lng,lat
  OSRM: lng,lat
  OSM Nominatim: lat,lng

limits:
  google.distance_matrix:  {max_origins: 25, max_destinations: 25, max_elements: 100}   # also 100 elements for traffic (departure_time) requests
  google.directions:       {max_waypoints: 25, essentials_max_intermediate_waypoints: 10}  # >10 intermediates bills as Pro
  google.routes_rate:      {max_requests_per_minute: 3000, max_matrix_elements_per_minute: 3000}  # Compute Routes 3,000 QPM; Compute Route Matrix 3,000 EPM
  mapbox.directions:       {max_coordinates: 25}
  mapbox.matrix:           {max_coordinates: 25, max_coordinates_driving_traffic: 10, max_elements: 625}
  mapbox.geocoding_batch:  {max_queries: 1000}
  ola.distance_matrix:     {max_pairs: 50}    # x origins * y destinations <= 50 per request
  ola.directions:          {max_waypoints: 25}
  ola.directions_basic:    {max_waypoints: 10}
  osm.nominatim:           {max_requests_per_second: 1}
  osrm.demo_server:        {max_requests_per_second: 1}
